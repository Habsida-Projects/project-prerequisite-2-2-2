name: Verify template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build WAR with JDK 21
        shell: pwsh
        run: |
          if ($IsWindows) { ./mvnw.cmd -B -ntp clean verify }
          else { sh ./mvnw -B -ntp clean verify }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download and verify Tomcat 11.0.27
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'apache-tomcat-11.0.27.zip'
          Invoke-WebRequest 'https://archive.apache.org/dist/tomcat/tomcat-11/v11.0.27/bin/apache-tomcat-11.0.27.zip' -OutFile $archive
          $expected = '0410cf4e15f525b5dc1330e2dbc8a14f4f2a447251d4bee17ae8baa135d5e01ed0b152e79c0e9ea534a14321c3883b9634d35a78a472c024394ca6aeb704ebff'
          if ((Get-FileHash $archive -Algorithm SHA512).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Tomcat SHA-512 mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          "TOMCAT_HOME=$(Join-Path $env:RUNNER_TEMP 'apache-tomcat-11.0.27')" >> $env:GITHUB_ENV
      - name: Test WAR on external Tomcat
        shell: pwsh
        run: |
          java scripts/SmokeTest.java "$env:TOMCAT_HOME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Tomcat logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tomcat-logs-${{ matrix.os }}
          path: |
            target/tomcat-smoke-*/tomcat.log
            target/tomcat-smoke-*/logs/**
          if-no-files-found: ignore
